rules:
  - id: python-sql-string-concat
    languages: [python]
    severity: ERROR
    message: SQL query built by string concatenation
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021-Injection"
    patterns:
      - pattern-either:
          - pattern: $Q = $A + $B
          - pattern: $Q = $A + $B + $C
      - metavariable-regex:
          metavariable: $A
          regex: (?i).*(select|insert|update|delete).*

  - id: python-sql-fstring
    languages: [python]
    severity: ERROR
    message: SQL query built with an f-string
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021-Injection"
    pattern-regex: (?i)f["'][^"']*(select|insert|update|delete)[^"']*\{

  - id: python-command-shell
    languages: [python]
    severity: ERROR
    message: Shell command built from a string
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021-Injection"
    pattern-either:
      - pattern: os.system(...)
      - pattern: subprocess.call(..., shell=True)
      - pattern: subprocess.run(..., shell=True)
      - pattern: subprocess.check_output(..., shell=True)
      - pattern: subprocess.Popen(..., shell=True)

  - id: python-html-concat
    languages: [python]
    severity: WARNING
    message: HTML built by string concatenation
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp: "A03:2021-Injection"
    patterns:
      - pattern-either:
          - pattern: return $A + $B
          - pattern: return $A + $B + $C
          - pattern: $Q = $A + $B
          - pattern: $Q = $A + $B + $C
      - metavariable-regex:
          metavariable: $A
          regex: (?i).*<[a-z][^>]*>.*

  - id: python-html-fstring
    languages: [python]
    severity: WARNING
    message: HTML built with an f-string
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp: "A03:2021-Injection"
    pattern-regex: (?i)f["'][^"']*<[a-z][^"']*\{
